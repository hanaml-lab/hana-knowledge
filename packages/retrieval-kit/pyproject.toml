[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrieval-kit"
version = "0.7.0"
description = "Hybrid BM25 and dense retrieval with cross-encoder reranking, and answers that cite a passage for every claim or abstain."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "hanaML", email = "hello@hanaml.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6"]
keywords = ["retrieval", "rag", "reranking", "citations"]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0"]
cpu = ["sentence-transformers>=3.0", "onnxruntime>=1.18"]
gpu = ["sentence-transformers>=3.0", "torch>=2.3"]
pdf = ["docling>=2.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/hanaml-lab/hana-knowledge/tree/main/packages/retrieval-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
