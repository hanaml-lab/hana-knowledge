[package]
name = "retrieval-kit-tantivy"
version = "0.6.2"
edition = "2021"
license = "Apache-2.0"
description = "BM25 index over Tantivy for retrieval-kit"
repository = "https://github.com/hanaml-lab/retrieval-kit"

[lib]
name = "retrieval_kit_tantivy"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
tantivy = "0.22"
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
