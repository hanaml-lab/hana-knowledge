services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/graph-memory
    volumes:
      - neo4j-data:/data
      - ./cypher:/var/lib/neo4j/import/cypher:ro

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  neo4j-data:
  qdrant-data:
